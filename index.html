<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fire X Scripts — Key Generator</title>
<style>
body{background:#0b0d12;color:#fff;font-family:sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:16px}
.card{width:100%;max-width:420px;background:#141821;border:1px solid #ff6b0055;border-radius:16px;padding:24px 20px;box-shadow:0 15px 40px #000}
h2{margin:0 0 4px;color:#ff8c3b;font-size:24px}
.sub{font-size:12px;color:#9ca3af;margin-bottom:20px}
.box{background:#0f131a;border:1px solid #232936;border-radius:12px;padding:16px;margin-bottom:14px}
.box:last-of-type{margin-bottom:0}
input{width:100%;box-sizing:border-box;background:#090b10;border:1px solid #2e3646;color:#fff;padding:11px;border-radius:8px;margin-top:6px}
.row{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.btn{width:100%;padding:13px;border:none;border-radius:9px;font-weight:700;font-size:14px;cursor:pointer;margin-top:12px;display:block;text-align:center;text-decoration:none;box-sizing:border-box}
.btn-top{margin-top:0}
.fire{background:linear-gradient(135deg,#ff512f,#f09819);color:#fff}
.dark{background:#1f2633;color:#e5e7eb;border:1px solid #323c4f}
.green{background:#10b981;color:#fff}
.key{background:#080a0e;border:1px dashed #ff6b00;color:#ffb36b;padding:14px;border-radius:8px;font-family:monospace;font-size:16px;text-align:center;margin-top:10px;word-break:break-all}
.msg{margin-top:14px;font-size:13px;padding:11px 12px;border-radius:8px;background:#1e293b;color:#93c5fd;display:none;text-align:center}
.hide{display:none}
</style>
</head>
<body>
<div class="card">
  <h2>Fire X Scripts</h2>
  <div class="sub">Official Key Generator & License Portal</div>

  <div class="box">
    <div id="idFieldWrap" class="hide" style="margin-bottom:12px">
      <label style="font-size:12px;color:#9ca3af">Player Account ID</label>
      <input id="acc" placeholder="Enter Account ID..." />
    </div>
    <button class="btn dark btn-top" id="chkBtn" onclick="loadStatus()">Check Progress</button>
  </div>

  <div id="panel" class="box hide">
    <div class="row"><span>Verified Ads:</span><strong id="ads" style="color:#ff8c3b">0 / 0</strong></div>
    <a id="adBtn" href="#" class="btn fire hide" onclick="saveAccount()">Watch Required Ad</a>
    <button id="clmBtn" class="btn green hide" onclick="claimKey()">Generate License Key</button>
  </div>

  <div id="keyBox" class="box hide">
    <div style="font-size:12px;color:#9ca3af;text-align:center">Your Active Fire X Key:</div>
    <div class="key" id="keyOut">-</div>
    <button class="btn fire" onclick="copyKey()">Copy Key</button>
  </div>

  <div id="msg" class="msg"></div>
</div>

<script>
const SB_HOST = "clgopzhigtwlcnonxewo" + ".supabase.co";
const API = "https://" + SB_HOST + "/functions/v1/license-api";

function show(t){const m=document.getElementById("msg");m.textContent=t;m.style.display="block"}
function hideMsg(){const m=document.getElementById("msg");m.style.display="none"}
function saveAccount(){const id=document.getElementById("acc").value.trim();if(id)localStorage.setItem("firex_acc",id)}

async function loadStatus(){
  const id=document.getElementById("acc").value.trim();
  if(!id){
    document.getElementById("idFieldWrap").classList.remove("hide");
    return show("Open this portal using the Copy Key Link button in-game, or enter your Account ID above.");
  }
  saveAccount();
  hideMsg();
  const btn=document.getElementById("chkBtn");
  btn.textContent="Checking...";
  try{
    const r=await fetch(API+"/status",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({account_id:id})});
    const d=await r.json();
    if(!d.success)return show(d.error||"Error");
    document.getElementById("panel").classList.remove("hide");
    document.getElementById("ads").textContent=d.completed_ads+" / "+d.required_ads+" Ads";
    const a=document.getElementById("adBtn"),c=document.getElementById("clmBtn");
    a.classList.add("hide");c.classList.add("hide");
    if(d.has_active_key){
      document.getElementById("panel").classList.add("hide");
      return show("Your license key is currently active.");
    }
    if(d.completed_ads>=d.required_ads){
      c.classList.remove("hide");
      c.textContent="Generate License Key";
    }else{
      a.classList.remove("hide");
      a.href=d.ad_link||"#";
      a.textContent="Watch Ad ("+(d.required_ads-d.completed_ads)+" Required)";
      show("Tap 'Watch Ad' and complete the verification task.");
    }
  }catch(e){
    show("Network error: "+e.message);
  }finally{
    btn.textContent="Check Progress";
  }
}

async function claimKey(){
  const id=document.getElementById("acc").value.trim();
  saveAccount();
  hideMsg();
  const r=await fetch(API+"/claim-key",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({account_id:id})});
  const d=await r.json();
  if(!d.success)return show(d.error||"Failed");
  document.getElementById("panel").classList.add("hide");
  document.getElementById("keyBox").classList.remove("hide");
  document.getElementById("keyOut").textContent=d.key;
}

function copyKey(){navigator.clipboard.writeText(document.getElementById("keyOut").textContent);show("Key copied!")}

(async function init(){
  const p=new URLSearchParams(window.location.search);
  const urlId=p.get("account_id");
  const id=(urlId||localStorage.getItem("firex_acc")||"").trim();
  if(id){
    document.getElementById("acc").value=id;
    saveAccount();
  }

  if(p.get("ad_done")==="1"){
    if(!id){
      document.getElementById("idFieldWrap").classList.remove("hide");
      return show("Account ID missing! Enter your Account ID above and tap Check Progress.");
    }
    if(!p.get("hash"))return show("Verification hash missing! Please complete the ad properly.");
    show("Verifying ad completion...");
    const tier=Number(p.get("tier")||1);
    const vr=await fetch(API+"/verify-linkvertise",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({account_id:id,hash:p.get("hash"),tier})});
    const vd=await vr.json();
    window.history.replaceState({},"",window.location.pathname);
    if(!vd.success)return show(vd.error||"Ad verification failed.");
    await claimKey();
    return;
  }
  if(id)loadStatus();
})();
</script>
</body>
</html>
